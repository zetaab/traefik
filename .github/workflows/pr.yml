name: Pull Request

on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened

jobs:
  buildpr:
    env:
      GOMEMLIMIT: 8GiB
      GOMAXPROCS: 6
    runs-on:
      - self-hosted
      - kaas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v4
        with:
          cache: false
          check-latest: false
          go-version: 1.21

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build binary
        run: |
          make build-image
          docker tag traefik/traefik:latest quay.io/elisaoyj/sre-traefik:${{ github.event.pull_request.head.sha }}
          docker push quay.io/elisaoyj/sre-traefik:${{ github.event.pull_request.head.sha }}